<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FeatureFountain host example</title>
    <script src="../dist/widget.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Request a feature</h1>
      <p>
        Set this example's public project ID and allow this host's exact origin
        in FeatureFountain.
      </p>
      <feature-fountain
        project-id="REPLACE_WITH_PUBLIC_PROJECT_UUID"
        api-base="http://127.0.0.1:3000"
      ></feature-fountain>
    </main>
  </body>
</html>
