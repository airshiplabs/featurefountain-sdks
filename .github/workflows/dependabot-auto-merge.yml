# Tier 1 of the PR review policy (brain decision 0003): Dependabot patch and minor updates to
# devDependencies (studio standard section 9) auto-merge once required checks pass.
# Everything else is labelled tier:2 for human review.
# Based on GitHub's "Automating Dependabot with GitHub Actions" docs (Enable auto-merge on a pull request).
name: Dependabot auto-merge
on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.repository == 'airshiplabs/featurefountain-sdks'
    permissions:
      contents: write # only exercised by `gh pr merge --auto`, which runs only when the repo variable TIER1_AUTO_MERGE == 'true' (currently unset); `--disable-auto` only has something to undo after that
      pull-requests: write # tier:1 / tier:2 labels via the REST issues labels API (pull-requests: write covers it on PRs), `gh pr merge --auto` and `--disable-auto`
      vulnerability-alerts: read # lets fetch-metadata look up Dependabot alerts (alert-lookup) so security updates stay out of Tier 1

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          alert-lookup: true

      # Tier 1 only when every dependency in the PR qualifies, so one excluded package keeps a grouped update out:
      #   - patch or minor: update-type is the highest change in the PR, so any major makes it major (decision 0003 rule 6).
      #   - devDependencies only (studio standard section 9): dependency-type must be direct:development, and no
      #     dependency in updated-dependencies-json may be direct:production or indirect (transitive).
      #   - not a security update: no Dependabot alert (GHSA ID) on any dependency (decision 0003 rule 10).
      #   - nothing from the decision 0003 rule 6 list below (exact names, or name prefixes):
      #   Framework families (next, react):
      #     exact: next, eslint-config-next, react, react-dom, @types/react, @types/react-dom
      #     prefix: @next/
      #   Auth, payment, crypto and session libraries:
      #     exact: better-auth, next-auth, clerk, lucia, arctic, jose, jsonwebtoken, iron-session, express-session, bcrypt, bcryptjs, argon2, crypto-js, tweetnacl, stripe
      #     prefix: @clerk/, @better-auth/, @auth/, @simplewebauthn/, @oslojs/, @noble/, @node-rs/argon2, @node-rs/bcrypt, @stripe/
      #   Expo-native packages:
      #     exact: expo, react-native
      #     prefix: expo-, @expo/, react-native
      #   Brand-hash inputs (brand standard v1.2: renderer, image transforms, font files):
      #     exact: satori, @vercel/og, sharp, geist
      #     prefix: @resvg/, @fontsource, @expo-google-fonts/
      #   This repo: none today. The base list stays so future additions are covered.
      - name: Label tier:1 and enable auto-merge (squash)
        id: tier1
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          && steps.metadata.outputs.dependency-type == 'direct:development'
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyType, 'direct:production')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyType, 'indirect')
          && join(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.ghsaId, '') == ''
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'next')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'eslint-config-next')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'react')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'react-dom')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, '@types/react')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, '@types/react-dom')
          && !contains(steps.metadata.outputs.dependency-names, '@next/')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'better-auth')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'next-auth')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'clerk')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'lucia')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'arctic')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'jose')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'jsonwebtoken')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'iron-session')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'express-session')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'bcrypt')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'bcryptjs')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'argon2')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'crypto-js')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'tweetnacl')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'stripe')
          && !contains(steps.metadata.outputs.dependency-names, '@clerk/')
          && !contains(steps.metadata.outputs.dependency-names, '@better-auth/')
          && !contains(steps.metadata.outputs.dependency-names, '@auth/')
          && !contains(steps.metadata.outputs.dependency-names, '@simplewebauthn/')
          && !contains(steps.metadata.outputs.dependency-names, '@oslojs/')
          && !contains(steps.metadata.outputs.dependency-names, '@noble/')
          && !contains(steps.metadata.outputs.dependency-names, '@node-rs/argon2')
          && !contains(steps.metadata.outputs.dependency-names, '@node-rs/bcrypt')
          && !contains(steps.metadata.outputs.dependency-names, '@stripe/')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'expo')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'react-native')
          && !contains(steps.metadata.outputs.dependency-names, 'expo-')
          && !contains(steps.metadata.outputs.dependency-names, '@expo/')
          && !contains(steps.metadata.outputs.dependency-names, 'react-native')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'satori')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, '@vercel/og')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'sharp')
          && !contains(fromJSON(steps.metadata.outputs.updated-dependencies-json).*.dependencyName, 'geist')
          && !contains(steps.metadata.outputs.dependency-names, '@resvg/')
          && !contains(steps.metadata.outputs.dependency-names, '@fontsource')
          && !contains(steps.metadata.outputs.dependency-names, '@expo-google-fonts/')
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=tier:1'
          # Never post the required "QA checks" status from a workflow (brain decision 0005); it is posted by bostonaholic/Airship QA App only.
          # Off unless the repo variable TIER1_AUTO_MERGE is 'true' (decision 0005). Checked here, not in the step's if:,
          # so eligible PRs still get tier:1 and this step still succeeds (no tier:2 fallback).
          if [ "$TIER1_AUTO_MERGE" = "true" ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "::notice::Tier 1 auto-merge is off until the Airship QA App exists (decision 0005); the QA checks status is posted as bostonaholic (by Tessa or Archie) after QA, never by a workflow, and an agent merges."
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          TIER1_AUTO_MERGE: ${{vars.TIER1_AUTO_MERGE}}

      # Anything that didn't qualify, or whose Tier 1 step failed (including a failed metadata lookup), needs human review.
      # Runs whatever TIER1_AUTO_MERGE is set to, so a later non-qualifying push always disarms an auto-merge armed by an earlier qualifying run.
      - name: Label tier:2 (human review)
        if: ${{ !cancelled() && steps.tier1.conclusion != 'success' }}
        run: |
          # Failure is tolerated for this command only: it fails when auto-merge was never enabled on the PR.
          if ! gh pr merge --disable-auto "$PR_URL"; then
            echo "::notice::gh pr merge --disable-auto failed; auto-merge was most likely never enabled on this PR."
          fi
          # Drop a stale tier:1 from an earlier qualifying run; a 404 means it wasn't set.
          if ! out=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/tier:1" 2>&1); then
            case "$out" in
              *"HTTP 404"*) echo "::notice::tier:1 was not set on this PR." ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=tier:2'
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
