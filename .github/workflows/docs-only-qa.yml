# Posts `QA checks` = success on a PR's head SHA only when the PR targets the
# default branch and every changed file is docs, per brain decision 0005
# (amended 2026-10-03, approved by Matthew). Otherwise normal QA (Tessa) applies.
#
# Security design:
# - pull_request_target runs the BASE branch's copy of this file, so a PR can't
#   edit this workflow to forge a pass.
# - Never checks out or runs PR code. It only reads the PR and a compare via the API.
# - Minimal read-only token plus statuses: write. contents: read is needed for
#   the compare API on private repos; nothing is checked out or executed.
# - Decides from `compare/<default-branch tip>...<head SHA>` (merge-base diff,
#   computed from SHAs), not the PR's cached file list, which GitHub recomputes
#   asynchronously after a retarget (e.g. a stacked PR auto-retargeted to main).
# - Statuses are per SHA, not per PR or base. So the job also runs on `edited`
#   (fired on a base change), only exempts PRs whose base is the default branch,
#   and when a PR isn't exempt it revokes its OWN earlier pass on the head SHA
#   (sets `pending`). It never overwrites a status anyone else posted.
# - Do not name a job "QA checks" (decision 0005).
name: docs-only-qa

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: docs-only-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-only-qa:
    name: docs-only-qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post or revoke the docs-only QA checks exemption
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          DOCS_DESC="Docs-only change: QA exempt (brain decision 0005)"
          REVOKE_DESC="Not docs-only against current base: normal QA required"
          RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/$REPO/actions/runs/${GITHUB_RUN_ID:-0}"

          # Docs patterns (keep identical across repos). A path is docs only if:
          # - no path segment starts with "." (.github/, .cursor/, .agents/, .claude/, ...)
          # - no directory segment is a user-facing content dir
          # - it is not an agent-instructions file (AGENTS.md, CLAUDE.md, GEMINI.md)
          # - it is not .mdx
          # - and it is under root docs/ OR ends in .md
          DEFS='
            def content_dirs: ["app","src","pages","content","public","blog","posts"];
            def is_docs:
              . as $p | ($p | split("/")) as $s
              | ($s | map(startswith(".")) | any | not)
                and ([$s[:-1][] | IN(content_dirs[])] | any | not)
                and (($s[-1] | ascii_downcase) | IN("agents.md","claude.md","gemini.md") | not)
                and ($p | test("\\.mdx$"; "i") | not)
                and (($p | startswith("docs/")) or ($p | test("\\.md$"; "i")));
          '

          # Not exempt: if the latest `QA checks` on the head SHA is this
          # workflow's own docs-only pass, replace it with `pending`. Never touch
          # a status anyone else posted (Tessa posts as bostonaholic).
          revoke() {
            echo "Not exempt: $1"
            latest=$(gh api --paginate "repos/$REPO/commits/$EVENT_SHA/statuses?per_page=100" \
              --jq '.[] | select(.context == "QA checks") | [.creator.login // "", .description // ""] | @tsv')
            latest=${latest%%$'\n'*} # newest first: first line is the latest
            if [ "$latest" = "github-actions[bot]"$'\t'"$DOCS_DESC" ]; then
              gh api -X POST "repos/$REPO/statuses/$EVENT_SHA" \
                -f state=pending \
                -f context="QA checks" \
                -f description="$REVOKE_DESC" \
                -f target_url="$RUN_URL" \
                --silent
              echo "Revoked this workflow's earlier pass on $EVENT_SHA (now pending)."
            else
              echo "Latest QA checks on $EVENT_SHA isn't our docs-only pass. Posting nothing."
            fi
            exit 0
          }

          # Retry an API read once before treating it as a failure. A failure
          # still fails closed: we revoke our own pass rather than leave it.
          retry() { "$@" || { sleep 5; "$@"; }; }

          pr_json=$(retry gh api "repos/$REPO/pulls/$PR")
          head=$(jq -r .head.sha <<<"$pr_json")
          if [ "$head" != "$EVENT_SHA" ]; then
            echo "Head moved to $head; the newer run decides. Posting nothing."
            exit 0
          fi
          base_ref=$(jq -r .base.ref <<<"$pr_json")
          base_sha=$(jq -r .base.sha <<<"$pr_json")
          draft=$(jq -r .draft <<<"$pr_json")

          [ "$draft" = "false" ] || revoke "draft PR"
          [ -n "$DEFAULT_BRANCH" ] && [ "$base_ref" = "$DEFAULT_BRANCH" ] \
            || revoke "base is '$base_ref', not the default branch '$DEFAULT_BRANCH'"

          # Diff the head against the default branch's current tip with the
          # compare API (merge-base, computed from SHAs), not pulls/N/files.
          tip=$(retry gh api "repos/$REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha) \
            || revoke "could not read the default branch tip"
          # Prints "missing" or "<files> <non-docs files>". Each file's filename
          # and previous_filename (renames) must match.
          summary=$(retry gh api "repos/$REPO/compare/$tip...$EVENT_SHA" --jq "$DEFS"'
            if (.files | type) != "array" then "missing"
            else "\(.files | length) \([.files[]
              | select([.filename, (.previous_filename // empty)] | all(is_docs) | not)] | length)"
            end') || revoke "could not compare $tip...$EVENT_SHA"

          [ "$summary" != "missing" ] || revoke "compare returned no file list"
          read -r total others <<<"$summary"
          echo "base=$base_ref tip=$tip files=$total non_docs=$others"

          [ "$total" -gt 0 ] || revoke "no files changed"
          [ "$total" -lt 300 ] || revoke "$total files: compare may be truncated at 300"
          [ "$others" -eq 0 ] || revoke "$others non-docs file(s)"

          # Re-fetch right before posting. If anything moved, the newer run decides.
          pr_json=$(retry gh api "repos/$REPO/pulls/$PR")
          if [ "$(jq -r .head.sha <<<"$pr_json")" != "$EVENT_SHA" ] \
            || [ "$(jq -r .base.ref <<<"$pr_json")" != "$base_ref" ] \
            || [ "$(jq -r .base.sha <<<"$pr_json")" != "$base_sha" ]; then
            echo "Head or base changed during the check; the newer run decides. Posting nothing."
            exit 0
          fi

          gh api -X POST "repos/$REPO/statuses/$EVENT_SHA" \
            -f state=success \
            -f context="QA checks" \
            -f description="$DOCS_DESC" \
            -f target_url="$RUN_URL" \
            --silent
          echo "Posted QA checks success on $EVENT_SHA."
